name: SecDevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-security-baseline:
    name: Validate PowerShell Project
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: PowerShell syntax validation (.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.ps1'
          if (-not $files) {
            Write-Host 'No .ps1 files found.'
            exit 0
          }

          $parseErrors = New-Object System.Collections.Generic.List[string]
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              foreach ($err in $errors) {
                $parseErrors.Add(("{0}:{1}:{2} {3}" -f $file.FullName, $err.Extent.StartLineNumber, $err.Extent.StartColumnNumber, $err.Message))
              }
            }
          }

          if ($parseErrors.Count -gt 0) {
            Write-Error "PowerShell syntax validation failed:`n$($parseErrors -join "`n")"
          }

          Write-Host "PowerShell syntax validation passed for $($files.Count) files."

      - name: Check for hardcoded secrets (expanded patterns)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanPatterns = @(
            '(?i)\b(password|passwd|pwd|secret|api[_-]?key|client[_-]?secret|private[_-]?key|access[_-]?key|auth[_-]?token|bearer[_-]?token|connectionstring)\b\s*[:=]\s*["`]?[^\s"`]{8,}',
            '(?i)\b(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})\b',
            '(?i)\bAKIA[0-9A-Z]{16}\b',
            '(?i)\bASIA[0-9A-Z]{16}\b',
            '(?i)-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          )

          $allowPatterns = @(
            '(?i)^\s*#',
            '(?i)example',
            '(?i)placeholder',
            '(?i)sample',
            '(?i)dummy',
            '(?i)changeme',
            '(?i)your[_-]?(password|secret|token|key)'
          )

          $targets = Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1,*.json,*.yml,*.yaml,*.md |
            Where-Object {
              $_.FullName -notmatch '(?i)\\.git\\' -and
              $_.FullName -notmatch '(?i)\\node_modules\\' -and
              $_.FullName -notmatch '(?i)\\artifacts\\'
            }

          $findings = New-Object System.Collections.Generic.List[string]
          foreach ($file in $targets) {
            $matches = Select-String -Path $file.FullName -Pattern $scanPatterns -AllMatches
            foreach ($match in $matches) {
              $line = ($match.Line | Out-String).Trim()
              if ([string]::IsNullOrWhiteSpace($line)) {
                continue
              }

              $isAllowed = $false
              foreach ($allowPattern in $allowPatterns) {
                if ($line -match $allowPattern) {
                  $isAllowed = $true
                  break
                }
              }

              if (-not $isAllowed) {
                $findings.Add(("{0}:{1}: {2}" -f $match.Path, $match.LineNumber, $line))
              }
            }
          }

          if ($findings.Count -gt 0) {
            Write-Host 'Potential hardcoded secrets detected:'
            $findings | ForEach-Object { Write-Host $_ }
            throw 'Hardcoded secret pattern check failed.'
          }

          Write-Host 'No hardcoded secret patterns detected by expanded scan.'

      - name: Validate JSON config files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jsonFiles = Get-ChildItem -Path './config' -File -Filter '*.json'
          if (-not $jsonFiles) {
            Write-Host 'No JSON files found under config/.'
            exit 0
          }

          foreach ($file in $jsonFiles) {
            try {
              Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json | Out-Null
              Write-Host "Valid JSON: $($file.FullName)"
            }
            catch {
              throw "Invalid JSON in $($file.FullName): $($_.Exception.Message)"
            }
          }

          Write-Host "JSON validation passed for $($jsonFiles.Count) config files."

      - name: Run development gate script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Unload any Pester version already in the session (runner may have Pester 5 auto-loaded)
          Remove-Module Pester -Force -ErrorAction SilentlyContinue

          # Install 3.4.0 to CurrentUser scope if absent
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          }

          # Prepend CurrentUser modules path so 3.4.0 is discovered before the system-level Pester 5
          $userMods = "$env:USERPROFILE\Documents\WindowsPowerShell\Modules"
          if ($env:PSModulePath -notlike "$userMods*") {
            $env:PSModulePath = "$userMods;$env:PSModulePath"
          }

          # Force-import 3.4.0 by explicit manifest path to bypass any version-priority ambiguity
          $pester34 = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'3.4.0' } | Select-Object -First 1
          if (-not $pester34) { throw 'Pester 3.4.0 not found after install step.' }
          Import-Module (Join-Path $pester34.ModuleBase 'Pester.psd1') -Force
          Write-Host "Pester loaded: $((Get-Module Pester).Version) from $((Get-Module Pester).ModuleBase)"

          if ('${{ github.event_name }}' -eq 'pull_request') {
            Write-Host 'Running developer gate in PR mode (integrity check skipped).'
            ./scripts/Invoke-DevGate.ps1 -SkipIntegrity
          }
          else {
            Write-Host 'Running full developer gate (including integrity check).'
            ./scripts/Invoke-DevGate.ps1
          }

      - name: Create CI evidence summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = '.\artifacts'
          if (-not (Test-Path -LiteralPath $artifactDir -PathType Container)) {
            New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          }

          $summaryPath = Join-Path $artifactDir 'secdevops-gate-summary.txt'
          $lines = @(
            ('Timestamp (UTC): {0}' -f (Get-Date).ToUniversalTime().ToString('o')),
            ('Commit SHA: {0}' -f $env:GITHUB_SHA),
            ('Repository: {0}' -f $env:GITHUB_REPOSITORY),
            ('Ref: {0}' -f $env:GITHUB_REF),
            ('Actor: {0}' -f $env:GITHUB_ACTOR),
            ('Run URL: https://github.com/{0}/actions/runs/{1}' -f $env:GITHUB_REPOSITORY, $env:GITHUB_RUN_ID),
            'Checks: PowerShell parser validation, expanded secret scan, JSON config validation, Invoke-DevGate execution',
            'Result: PASS if job completed successfully; see workflow logs for detailed evidence.'
          )

          Set-Content -LiteralPath $summaryPath -Value $lines -Encoding UTF8

      - name: Collect repository evidence files
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = '.\artifacts'
          if (-not (Test-Path -LiteralPath $artifactDir -PathType Container)) {
            New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          }

          $evidenceFiles = @(
            '.\README.md',
            '.\docs\CHANGELOG.md',
            '.\docs\CONTROLS.md',
            '.\docs\mitre-mapping.md',
            '.\config\baseline.json',
            '.\config\settings.json',
            '.\config\module-hashes.json'
          )

          foreach ($file in $evidenceFiles) {
            if (Test-Path -LiteralPath $file -PathType Leaf) {
              Copy-Item -LiteralPath $file -Destination (Join-Path $artifactDir (Split-Path -Path $file -Leaf)) -Force
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: secops-evidence
          path: |
            README.md
            CHANGELOG.md
            CONTROLS.md
            artifacts/secdevops-gate-summary.txt
          # Explicitly excluded: config/module-hashes.json
          # Explicitly excluded: config/security-checkpoint.json
